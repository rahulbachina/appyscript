<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AppyScript Playground</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0 }

    :root {
      --bg:      #0f1117;
      --panel:   #1a1d27;
      --border:  #2a2d3e;
      --accent:  #7c6af7;
      --accent2: #5eead4;
      --text:    #e2e8f0;
      --muted:   #64748b;
      --error:   #f87171;
      --warn:    #fbbf24;
      --ok:      #34d399;
      --code:    #1e2130;
      --mono:    'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
    }

    body {
      background: var(--bg); color: var(--text);
      font-family: system-ui, sans-serif;
      display: flex; flex-direction: column; height: 100vh; overflow: hidden;
    }

    /* ── Top bar ── */
    header {
      display: flex; align-items: center; gap: 16px;
      padding: 10px 20px; border-bottom: 1px solid var(--border);
      background: var(--panel); flex-shrink: 0;
    }
    .logo { font-size: 18px; font-weight: 700; color: var(--accent); letter-spacing: -0.5px }
    .logo span { color: var(--accent2) }
    .tagline { font-size: 12px; color: var(--muted); display: none }
    @media (min-width: 600px) { .tagline { display: block } }

    .controls { display: flex; gap: 8px; align-items: center; margin-left: auto }

    select {
      background: var(--code); color: var(--text);
      border: 1px solid var(--border); border-radius: 6px;
      padding: 6px 10px; font-size: 13px; cursor: pointer;
    }

    button {
      padding: 7px 16px; border-radius: 6px; border: none;
      font-size: 13px; font-weight: 600; cursor: pointer; transition: opacity .15s;
    }
    button:hover { opacity: .85 }
    button:active { opacity: .7 }
    .btn-primary { background: var(--accent);  color: #fff }
    .btn-sim     { background: var(--accent2); color: #0f1117 }
    .btn-clear   { background: var(--border);  color: var(--text) }

    /* ── Main layout ── */
    main {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr auto;
      flex: 1; overflow: hidden;
      gap: 0;
    }
    @media (max-width: 700px) {
      main { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr auto }
    }

    /* ── Editor ── */
    .editor-pane {
      display: flex; flex-direction: column;
      border-right: 1px solid var(--border); overflow: hidden;
    }
    .pane-label {
      padding: 8px 16px; font-size: 11px; font-weight: 700;
      letter-spacing: .08em; color: var(--muted); text-transform: uppercase;
      border-bottom: 1px solid var(--border); background: var(--panel);
      display: flex; align-items: center; gap: 8px;
    }
    .pane-label .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent) }

    textarea#editor {
      flex: 1; resize: none; border: none; outline: none;
      background: var(--code); color: var(--text);
      font-family: var(--mono); font-size: 14px; line-height: 1.7;
      padding: 16px; tab-size: 2;
    }

    /* ── Output ── */
    .output-pane {
      display: flex; flex-direction: column; overflow: hidden;
    }
    .output-tabs {
      display: flex; border-bottom: 1px solid var(--border);
      background: var(--panel); flex-shrink: 0;
    }
    .tab {
      padding: 8px 16px; font-size: 12px; font-weight: 600; cursor: pointer;
      color: var(--muted); border-bottom: 2px solid transparent;
      transition: all .15s; user-select: none;
    }
    .tab.active { color: var(--accent); border-bottom-color: var(--accent) }
    .tab-content { flex: 1; overflow: auto; position: relative }

    pre#output-code {
      font-family: var(--mono); font-size: 13px; line-height: 1.65;
      padding: 16px; color: var(--text); background: var(--code);
      height: 100%; overflow: auto; white-space: pre;
    }

    /* ── Diagnostics ── */
    #diag-panel {
      grid-column: 1 / -1;
      border-top: 1px solid var(--border);
      background: var(--panel); overflow: auto;
      max-height: 160px; flex-shrink: 0;
    }
    .diag-row {
      display: flex; align-items: flex-start; gap: 10px;
      padding: 7px 16px; font-size: 13px; border-bottom: 1px solid var(--border);
    }
    .diag-row:last-child { border-bottom: none }
    .diag-error  { color: var(--error) }
    .diag-warn   { color: var(--warn)  }
    .diag-hint   { color: var(--accent2) }
    .diag-ok     { color: var(--ok); padding: 10px 16px; font-size: 13px }
    .diag-code   { font-family: var(--mono); font-size: 11px; opacity: .6 }
    .diag-loc    { font-family: var(--mono); font-size: 11px; opacity: .5 }

    /* ── Simulator view ── */
    #sim-panel { padding: 16px; font-family: var(--mono); font-size: 13px }
    .sim-event {
      display: flex; gap: 10px; padding: 4px 0; border-bottom: 1px solid var(--border);
    }
    .sim-tick  { color: var(--muted); min-width: 36px }
    .sim-type  { color: var(--accent); min-width: 80px }
    .sim-data  { color: var(--text) }
    .sim-state { margin-top: 16px; padding: 12px; background: var(--code); border-radius: 8px }
    .sim-state h3 { font-size: 12px; color: var(--muted); margin-bottom: 8px; text-transform: uppercase; letter-spacing: .08em }
    .sim-kv { display: flex; gap: 12px; margin: 3px 0 }
    .sim-k  { color: var(--muted); min-width: 100px }
    .sim-v  { color: var(--accent2) }

    /* ── Examples picker ── */
    .examples-btn {
      background: transparent; color: var(--muted); border: 1px solid var(--border);
      padding: 6px 12px; font-size: 12px;
    }

    /* ── Status badge ── */
    .badge {
      font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px;
    }
    .badge-ok    { background: #064e3b; color: var(--ok) }
    .badge-error { background: #450a0a; color: var(--error) }
    .badge-warn  { background: #451a03; color: var(--warn) }

    /* ── Copy button ── */
    .copy-btn {
      position: absolute; top: 8px; right: 8px;
      background: var(--border); color: var(--text);
      border: none; border-radius: 4px; padding: 4px 10px;
      font-size: 11px; cursor: pointer; opacity: .7;
    }
    .copy-btn:hover { opacity: 1 }

    .empty-state {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      height: 100%; color: var(--muted); gap: 8px; font-size: 14px;
    }
    .empty-state .hint { font-size: 12px; opacity: .6 }
  </style>
</head>
<body>

<header>
  <div class="logo">Appy<span>Script</span></div>
  <div class="tagline">The English-first language for robotics</div>

  <div class="controls">
    <select id="example-select">
      <option value="">📂 Load example...</option>
      <option value="guard">Guard Robot</option>
      <option value="dance">Dance Robot</option>
      <option value="quiz">Quiz Robot</option>
      <option value="fortune">Fortune Teller</option>
      <option value="reaction">Reaction Game</option>
      <option value="hello">Hello World</option>
    </select>

    <select id="target-select">
      <option value="esp32">ESP32</option>
      <option value="pico">Pico W</option>
      <option value="microbit">micro:bit</option>
      <option value="arduino">Arduino</option>
      <option value="circuitpython">CircuitPython</option>
    </select>

    <button class="btn-sim" onclick="runSimulate()">▶ Simulate</button>
    <button class="btn-primary" onclick="runCompile()">⚡ Compile</button>
  </div>
</header>

<main>
  <div class="editor-pane">
    <div class="pane-label">
      <div class="dot"></div>
      AppyScript Source
      <span id="status-badge"></span>
    </div>
    <textarea id="editor" spellcheck="false" placeholder="# Write your AppyScript here...
# Try: Load example ↑ or start typing

when button_a pressed
  say &quot;Hello World!&quot;
  show happy
end"></textarea>
  </div>

  <div class="output-pane">
    <div class="output-tabs">
      <div class="tab active" onclick="switchTab('code')"   id="tab-code">Generated Code</div>
      <div class="tab"        onclick="switchTab('sim')"    id="tab-sim">Simulation</div>
      <div class="tab"        onclick="switchTab('explain')" id="tab-explain">Explain</div>
    </div>
    <div class="tab-content">
      <div id="view-code" style="height:100%;position:relative">
        <pre id="output-code"><div class="empty-state">
  <div>⚡ Click Compile to generate code</div>
  <div class="hint">or ▶ Simulate to run without hardware</div>
</div></pre>
        <button class="copy-btn" onclick="copyCode()">Copy</button>
      </div>
      <div id="view-sim"  style="display:none;height:100%;overflow:auto"><div id="sim-panel"></div></div>
      <div id="view-explain" style="display:none;height:100%;overflow:auto;padding:16px;font-size:14px;line-height:1.7" id="explain-content"></div>
    </div>
  </div>

  <div id="diag-panel">
    <div class="diag-ok">Ready — write some AppyScript and click Compile or Simulate.</div>
  </div>
</main>

<script type="module">
// Load AppyScript compiler via CDN (unpkg) in production.
// In development: served from /dist/index.js by the dev server.
// For the playground HTML file, we bundle the compiler inline.

// ── Embedded minimal compiler (full compiler loaded from npm in production) ──

// This inline version handles the core compile/simulate/explain loop.
// Replace with:  import { compile, simulate, explain } from 'https://unpkg.com/appyscript@1.0.0/dist/index.js'

const EXAMPLES = {
  hello: `when start
  say "Hello World!"
  show happy
  wait 1s
end

when button_a pressed
  say "Button A pressed!"
  show excited
end`,

  guard: `when start
  say "Guard mode on"
  show alert
end

when distance < 30cm
  say "INTRUDER ALERT!"
  show angry
  spin right 180
  wait 1s
  show alert
end

forever
  if distance > 60cm
    show happy
  end
  wait 500ms
end`,

  dance: `define celebrate
  show excited
  say "Yay!"
  spin right 360
  play "success"
end

define wiggle
  turn left 45
  turn right 90
  turn left 45
end

when button_a pressed
  do celebrate
end

when shaken
  do wiggle
end`,

  quiz: `let score = 0
load score

when start
  say "Welcome! Score: {score}"
end

when button_a pressed
  let answer = ask "What is 5 + 3?"
  if answer == "8"
    change score by 1
    save score
    say "Correct! Score: {score}"
    show excited
  else
    say "Not quite! The answer is 8"
    show sad
  end
end

when button_b pressed
  match score
    case < 3
      say "Keep practising!"
      show thinking
    case 3 to 7
      say "Good work - score: {score}!"
      show happy
    case > 7
      say "Amazing! Score: {score}"
      show excited
  end
end`,

  fortune: `let fortunes = list
add "Yes, definitely!" to fortunes
add "Ask again later" to fortunes
add "Outlook not so good" to fortunes
add "It is certain!" to fortunes
add "Very doubtful" to fortunes

when shaken
  let n = pick random 1 to 5
  let answer = item n of fortunes
  say answer
  show thinking
  wait 2s
  show calm
end`,

  reaction: `let best = 999
load best

when start
  say "Best time: {best}ms"
  show calm
end

when button_a pressed
  let delay = pick random 2 to 6
  wait delay
  show alert
  let start_ms = 0
  wait until button_b == yes
  say "Reaction recorded!"
  show happy
end`,
}

// ── Tab switching ─────────────────────────────────────────────────────────────

window.switchTab = (name) => {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'))
  document.querySelectorAll('[id^="view-"]').forEach(v => v.style.display = 'none')
  document.getElementById('tab-' + name).classList.add('active')
  document.getElementById('view-' + name).style.display = 'block'
}

// ── Example loading ───────────────────────────────────────────────────────────

document.getElementById('example-select').addEventListener('change', (e) => {
  const key = e.target.value
  if (key && EXAMPLES[key]) {
    document.getElementById('editor').value = EXAMPLES[key]
    e.target.value = ''
    runCompile()
  }
})

// ── Auto-compile on edit (debounced) ─────────────────────────────────────────

let debounceTimer
document.getElementById('editor').addEventListener('input', () => {
  clearTimeout(debounceTimer)
  debounceTimer = setTimeout(runCompile, 800)
})

// ── Compile ───────────────────────────────────────────────────────────────────

window.runCompile = async () => {
  const source = document.getElementById('editor').value.trim()
  if (!source) return
  const target = document.getElementById('target-select').value

  try {
    // Dynamic import from npm bundle (development: local file)
    const { compile, explain } = await loadCompiler()

    const result = compile(source, target)
    renderDiagnostics(result.diagnostics, source)
    renderBadge(result)

    document.getElementById('output-code').textContent =
      result.code || '# No code generated'

    document.getElementById('view-explain').innerHTML =
      formatExplain(explain(source))

  } catch (err) {
    document.getElementById('output-code').textContent = '# Error: ' + err.message
    renderDiagnostics([{ severity:'error', code:'E000', message: err.message }], source)
  }
}

// ── Simulate ──────────────────────────────────────────────────────────────────

window.runSimulate = async () => {
  const source = document.getElementById('editor').value.trim()
  if (!source) return
  switchTab('sim')

  try {
    const { compile, simulate } = await loadCompiler()
    const cResult = compile(source, 'esp32')
    if (!cResult.ast) { renderSimError('Fix compile errors first'); return }

    const result = simulate(cResult.ast, {
      sensors: { distance: 25, light: 60, temperature: 22, touch: 0, acceleration: 0 },
      buttons: {},
      maxTicks: 30,
    })
    renderSim(result)
  } catch (err) {
    renderSimError(err.message)
  }
}

// ── Render helpers ────────────────────────────────────────────────────────────

function renderDiagnostics(diagnostics, source) {
  const panel = document.getElementById('diag-panel')
  if (!diagnostics.length) {
    panel.innerHTML = '<div class="diag-ok">✔ No errors or warnings</div>'
    return
  }
  const sourceLines = source.split('\n')
  panel.innerHTML = diagnostics.map(d => {
    const cls = `diag-${d.severity === 'error' ? 'error' : d.severity === 'warning' ? 'warn' : 'hint'}`
    const icon = d.severity === 'error' ? '✖' : d.severity === 'warning' ? '⚠' : '●'
    const loc = d.span ? `Line ${d.span.line}:${d.span.col}` : ''
    const srcLine = d.span ? (sourceLines[d.span.line - 1] || '').trim() : ''
    return `<div class="diag-row ${cls}">
      <span>${icon}</span>
      <span class="diag-code">[${d.code}]</span>
      <span style="flex:1">${escHtml(d.message)}${d.hint ? `<br><small style="opacity:.7">ℹ ${escHtml(d.hint)}</small>` : ''}</span>
      <span class="diag-loc">${loc}</span>
    </div>`
  }).join('')
}

function renderBadge(result) {
  const badge = document.getElementById('status-badge')
  if (!result.ok) {
    badge.innerHTML = `<span class="badge badge-error">✖ ${result.errors.length} error${result.errors.length>1?'s':''}</span>`
  } else if (result.warnings.length) {
    badge.innerHTML = `<span class="badge badge-warn">⚠ ${result.warnings.length} warning${result.warnings.length>1?'s':''}</span>`
  } else {
    badge.innerHTML = `<span class="badge badge-ok">✔ OK</span>`
  }
}

function renderSim(result) {
  const panel = document.getElementById('sim-panel')
  const events = result.events.slice(0, 50)

  const evHtml = events.map(e => {
    const detail = Object.entries(e.data).map(([k,v]) => `${k}=<b>${escHtml(String(v))}</b>`).join(' ')
    return `<div class="sim-event">
      <span class="sim-tick">[${e.tick}]</span>
      <span class="sim-type">${e.type}</span>
      <span class="sim-data">${detail}</span>
    </div>`
  }).join('')

  const s = result.finalState
  const vars = [...s.variables.entries()].map(([k,v]) =>
    `<div class="sim-kv"><span class="sim-k">${k}</span><span class="sim-v">${v}</span></div>`
  ).join('')

  panel.innerHTML = `
    <div style="color:var(--muted);font-size:12px;margin-bottom:12px">
      ${result.success ? '✔ Simulation complete' : '✖ Simulation error'} — 
      ${result.events.length} events, ${result.ticks} ticks
      ${result.error ? `<br><span style="color:var(--error)">${escHtml(result.error)}</span>` : ''}
    </div>
    ${evHtml || '<div style="color:var(--muted)">No events fired. Try pressing a button or shaking the robot.</div>'}
    <div class="sim-state">
      <h3>Final state</h3>
      <div class="sim-kv"><span class="sim-k">position</span><span class="sim-v">x=${s.position.x.toFixed(1)}, y=${s.position.y.toFixed(1)}, heading=${s.position.heading}°</span></div>
      <div class="sim-kv"><span class="sim-k">expression</span><span class="sim-v">${s.expression}</span></div>
      <div class="sim-kv"><span class="sim-k">display</span><span class="sim-v">${escHtml(s.displayText||'(blank)')}</span></div>
      ${vars ? `<div class="sim-kv"><span class="sim-k">variables</span><span class="sim-v"></span></div>${vars}` : ''}
    </div>
  `
}

function renderSimError(msg) {
  document.getElementById('sim-panel').innerHTML =
    `<div style="color:var(--error);padding:16px">✖ ${escHtml(msg)}</div>`
}

function formatExplain(text) {
  return text.split('\n').map(line =>
    line.startsWith('•') ? `<div style="padding:4px 0;border-bottom:1px solid var(--border)">${escHtml(line)}</div>` : escHtml(line)
  ).join('')
}

window.copyCode = () => {
  const code = document.getElementById('output-code').textContent
  navigator.clipboard.writeText(code).then(() => {
    const btn = document.querySelector('.copy-btn')
    btn.textContent = 'Copied!'
    setTimeout(() => btn.textContent = 'Copy', 1500)
  })
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
}

// ── Compiler loading ───────────────────────────────────────────────────────────
// In production: loads from npm CDN
// In development: loads from local dist/

let _compiler = null
async function loadCompiler() {
  if (_compiler) return _compiler
  try {
    // Try local development server first
    _compiler = await import('/dist/index.js')
  } catch {
    // Fall back to CDN (set correct version on publish)
    _compiler = await import('https://unpkg.com/appyscript@1.0.0/dist/index.js')
  }
  return _compiler
}

// ── Auto-run on load ──────────────────────────────────────────────────────────

document.getElementById('editor').value = EXAMPLES.guard
setTimeout(runCompile, 300)
</script>
</body>
</html>
