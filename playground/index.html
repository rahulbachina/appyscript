<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AppyScript Playground — English-first robotics language</title>
  <meta name="description" content="Write robot programs in plain English. AppyScript compiles to ESP32, Pico, micro:bit, Arduino and more.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤖</text></svg>">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#0f1117;--panel:#1a1d27;--border:#2a2d3e;
      --accent:#7c6af7;--accent2:#5eead4;
      --text:#e2e8f0;--muted:#64748b;
      --error:#f87171;--warn:#fbbf24;--ok:#34d399;--code:#1e2130;
      --mono:'JetBrains Mono','Fira Code','Courier New',monospace;
    }
    body{background:var(--bg);color:var(--text);font-family:system-ui,sans-serif;display:flex;flex-direction:column;height:100vh;overflow:hidden}

    /* Header */
    header{display:flex;align-items:center;gap:16px;padding:10px 20px;border-bottom:1px solid var(--border);background:var(--panel);flex-shrink:0;flex-wrap:wrap;gap:8px}
    .logo{font-size:18px;font-weight:800;color:var(--accent);letter-spacing:-0.5px;white-space:nowrap}
    .logo span{color:var(--accent2)}
    .tagline{font-size:12px;color:var(--muted);display:none}
    @media(min-width:640px){.tagline{display:block}}
    .controls{display:flex;gap:8px;align-items:center;margin-left:auto;flex-wrap:wrap}
    select{background:var(--code);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:6px 10px;font-size:13px;cursor:pointer}
    button{padding:7px 16px;border-radius:6px;border:none;font-size:13px;font-weight:600;cursor:pointer;transition:opacity .15s;white-space:nowrap}
    button:hover{opacity:.85} button:active{opacity:.7}
    .btn-primary{background:var(--accent);color:#fff}
    .btn-sim{background:var(--accent2);color:#0f1117}
    .btn-share{background:var(--border);color:var(--text);font-size:12px;padding:6px 12px}

    /* Main layout */
    main{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr auto;flex:1;overflow:hidden}
    @media(max-width:700px){main{grid-template-columns:1fr;grid-template-rows:40vh 1fr auto}}

    /* Editor */
    .editor-pane{display:flex;flex-direction:column;border-right:1px solid var(--border);overflow:hidden}
    .pane-label{padding:8px 16px;font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;border-bottom:1px solid var(--border);background:var(--panel);display:flex;align-items:center;gap:8px;flex-shrink:0}
    .dot{width:8px;height:8px;border-radius:50%;background:var(--accent)}
    textarea#editor{flex:1;resize:none;border:none;outline:none;background:var(--code);color:var(--text);font-family:var(--mono);font-size:14px;line-height:1.7;padding:16px;tab-size:2}

    /* Output */
    .output-pane{display:flex;flex-direction:column;overflow:hidden}
    .output-tabs{display:flex;border-bottom:1px solid var(--border);background:var(--panel);flex-shrink:0}
    .tab{padding:8px 16px;font-size:12px;font-weight:600;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;transition:all .15s;user-select:none}
    .tab.active{color:var(--accent);border-bottom-color:var(--accent)}
    .tab-content{flex:1;overflow:auto;position:relative}
    pre#output-code{font-family:var(--mono);font-size:13px;line-height:1.65;padding:16px;color:var(--text);background:var(--code);min-height:100%;white-space:pre;overflow:auto}

    /* Diagnostics bar */
    #diag-panel{grid-column:1/-1;border-top:1px solid var(--border);background:var(--panel);overflow:auto;max-height:150px;flex-shrink:0}
    .diag-row{display:flex;align-items:flex-start;gap:10px;padding:7px 16px;font-size:13px;border-bottom:1px solid var(--border)}
    .diag-row:last-child{border-bottom:none}
    .diag-error{color:var(--error)} .diag-warn{color:var(--warn)} .diag-hint{color:var(--accent2)}
    .diag-ok{color:var(--ok);padding:10px 16px;font-size:13px}
    .diag-code{font-family:var(--mono);font-size:11px;opacity:.6}
    .diag-loc{font-family:var(--mono);font-size:11px;opacity:.5;white-space:nowrap}

    /* Simulator */
    #sim-panel{padding:16px;font-family:var(--mono);font-size:13px}
    .sim-event{display:flex;gap:10px;padding:4px 0;border-bottom:1px solid var(--border)}
    .sim-tick{color:var(--muted);min-width:36px}
    .sim-type{color:var(--accent);min-width:80px}
    .sim-state{margin-top:16px;padding:12px;background:var(--code);border-radius:8px}
    .sim-state h3{font-size:11px;color:var(--muted);margin-bottom:8px;text-transform:uppercase;letter-spacing:.08em}
    .sim-kv{display:flex;gap:12px;margin:3px 0;font-size:12px}
    .sim-k{color:var(--muted);min-width:100px} .sim-v{color:var(--accent2)}

    /* Sensor sliders */
    #sim-controls{padding:12px 16px;background:var(--panel);border-bottom:1px solid var(--border);display:flex;gap:16px;flex-wrap:wrap;align-items:center;font-size:12px}
    .slider-group{display:flex;align-items:center;gap:8px}
    .slider-group label{color:var(--muted);white-space:nowrap}
    input[type=range]{width:80px;accent-color:var(--accent)}
    .slider-val{color:var(--accent2);min-width:36px}

    /* Badges */
    .badge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px}
    .badge-ok{background:#064e3b;color:var(--ok)}
    .badge-error{background:#450a0a;color:var(--error)}
    .badge-warn{background:#451a03;color:var(--warn)}

    /* Copy */
    .copy-btn{position:absolute;top:8px;right:8px;background:var(--border);color:var(--text);border:none;border-radius:4px;padding:4px 10px;font-size:11px;cursor:pointer;opacity:.7}
    .copy-btn:hover{opacity:1}

    .empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;height:200px;color:var(--muted);gap:8px;font-size:14px}
    .spinner{width:20px;height:20px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto}
    @keyframes spin{to{transform:rotate(360deg)}}

    /* Explain tab */
    #view-explain{padding:16px;font-size:14px;line-height:1.8;overflow:auto;height:100%}
    .explain-block{padding:8px 0;border-bottom:1px solid var(--border);display:flex;gap:10px}
    .explain-icon{color:var(--accent);flex-shrink:0}

    /* Share toast */
    #toast{position:fixed;bottom:20px;right:20px;background:var(--ok);color:#064e3b;padding:10px 18px;border-radius:8px;font-weight:600;font-size:13px;opacity:0;transition:opacity .3s;pointer-events:none}
    #toast.show{opacity:1}
  </style>
</head>
<body>

<header>
  <div class="logo">Appy<span>Script</span> <span style="font-size:12px;font-weight:400;color:var(--muted)">v1.0.0</span></div>
  <div class="tagline">English-first language for educational robotics</div>

  <div class="controls">
    <select id="example-select">
      <option value="">📂 Load example...</option>
    </select>

    <select id="target-select">
      <option value="esp32">ESP32 / M5Stack</option>
      <option value="pico">Raspberry Pi Pico W</option>
      <option value="microbit">BBC micro:bit</option>
      <option value="arduino">Arduino</option>
      <option value="circuitpython">Adafruit / CircuitPython</option>
    </select>

    <button class="btn-share" onclick="shareProgram()">🔗 Share</button>
    <button class="btn-sim" onclick="runSimulate()">▶ Simulate</button>
    <button class="btn-primary" onclick="runCompile()">⚡ Compile</button>
  </div>
</header>

<main>
  <div class="editor-pane">
    <div class="pane-label">
      <div class="dot"></div>
      AppyScript
      <span id="status-badge"></span>
      <span style="margin-left:auto;font-size:10px;opacity:.5" id="line-count"></span>
    </div>
    <textarea id="editor" spellcheck="false" autocorrect="off" autocapitalize="off"></textarea>
  </div>

  <div class="output-pane">
    <div class="output-tabs">
      <div class="tab active" onclick="switchTab('code')"    id="tab-code">Generated Code</div>
      <div class="tab"        onclick="switchTab('sim')"     id="tab-sim">Simulate</div>
      <div class="tab"        onclick="switchTab('explain')" id="tab-explain">Explain</div>
    </div>
    <div class="tab-content">
      <div id="view-code" style="height:100%;position:relative">
        <pre id="output-code"><div class="empty-state"><div class="spinner"></div><div>Loading compiler...</div></div></pre>
        <button class="copy-btn" onclick="copyCode()">Copy</button>
      </div>
      <div id="view-sim" style="display:none;height:100%;overflow:auto">
        <div id="sim-controls">
          <strong style="color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.08em">Sensors</strong>
          <div class="slider-group">
            <label>distance</label>
            <input type="range" id="s-distance" min="0" max="200" value="80" oninput="this.nextElementSibling.textContent=this.value+'cm'">
            <span class="slider-val">80cm</span>
          </div>
          <div class="slider-group">
            <label>light</label>
            <input type="range" id="s-light" min="0" max="100" value="60" oninput="this.nextElementSibling.textContent=this.value+'%'">
            <span class="slider-val">60%</span>
          </div>
          <div class="slider-group">
            <label>temp</label>
            <input type="range" id="s-temp" min="-10" max="50" value="22" oninput="this.nextElementSibling.textContent=this.value+'°C'">
            <span class="slider-val">22°C</span>
          </div>
          <label style="display:flex;gap:6px;align-items:center;cursor:pointer">
            <input type="checkbox" id="s-btn-a"> Button A
          </label>
          <label style="display:flex;gap:6px;align-items:center;cursor:pointer">
            <input type="checkbox" id="s-btn-b"> Button B
          </label>
          <label style="display:flex;gap:6px;align-items:center;cursor:pointer">
            <input type="checkbox" id="s-shaken"> Shaken
          </label>
        </div>
        <div id="sim-panel"></div>
      </div>
      <div id="view-explain" style="display:none"></div>
    </div>
  </div>

  <div id="diag-panel">
    <div class="diag-ok">Loading AppyScript compiler...</div>
  </div>
</main>

<div id="toast">🔗 Link copied to clipboard!</div>

<script>
// ── Utilities ─────────────────────────────────────────────────────────────────
const $  = id => document.getElementById(id)
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')

// ── Tab switching ─────────────────────────────────────────────────────────────
function switchTab(name) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'))
  document.querySelectorAll('[id^="view-"]').forEach(v => v.style.display='none')
  $('tab-'+name).classList.add('active')
  $('view-'+name).style.display = 'block'
}

// ── Compiler loading (CJS via script tag) ─────────────────────────────────────
let compiler = null

function loadCompiler() {
  return new Promise((resolve, reject) => {
    if (compiler) { resolve(compiler); return }
    // Try to load the CommonJS build as a module-like object
    const script = document.createElement('script')
    // GitHub Pages serves from /appyscript/ subpath; localhost from /
    const base = location.hostname === 'localhost' ? '' : '/appyscript'
    script.src = base + '/dist/index.js'
    script.onload = () => {
      // The CJS bundle exports to module.exports — we access via global
      // For GitHub Pages we need a UMD build; use the global appyscript object
      if (window.appyscript) { compiler = window.appyscript; resolve(compiler) }
      else {
        // Fallback: try require() if available (dev server with bundler)
        reject(new Error('Compiler not available — see console for details. Try running: npm run build'))
      }
    }
    script.onerror = () => reject(new Error('Failed to load compiler script'))
    document.head.appendChild(script)
  })
}

// ── Build UMD bundle ──────────────────────────────────────────────────────────
// Since the compiler is CommonJS, we need a small wrapper to expose it as a global.
// This is created by the build step (see package.json scripts).
// For now, we inline the API calls using dynamic evaluation.

async function getCompiler() {
  if (compiler) return compiler
  try {
    // Try dynamic import (works in dev with proper MIME types)
    const base = location.hostname === 'localhost' ? '' : '/appyscript'
    const mod = await import(base + '/dist/index.browser.js')
    compiler = mod
    return compiler
  } catch(e) {
    console.error('Import failed:', e)
    throw new Error('Compiler could not be loaded. Make sure you ran: npm run build')
  }
}

// ── Examples loading ──────────────────────────────────────────────────────────
const BUILTIN_EXAMPLES = {
  guard_robot: `when start
  say "Guard mode active"
  show alert
end

when distance < 30cm
  say "INTRUDER ALERT!"
  show angry
  spin right 180
  wait 1s
  show alert
end

forever
  if distance > 60cm
    show happy
  end
  wait 500ms
end`,

  dance: `define celebrate
  show excited
  say "Yay!"
  spin right 360
  play "success"
end

define wiggle
  turn left 45
  turn right 90
  turn left 45
end

when button_a pressed
  do celebrate
end

when shaken
  do wiggle
end`,

  quiz_robot: `let score = 0
load score

when start
  say "Welcome! Score: {score}"
  show happy
end

when button_a pressed
  let answer = ask "What is 5 + 3?"
  if answer == "8"
    change score by 1
    save score
    say "Correct! Score: {score}"
    show excited
    play "success"
  else
    say "Not quite! Answer is 8"
    show sad
  end
end

when button_b pressed
  match score
    case < 3
      say "Keep practising!"
      show thinking
    case 3 to 7
      say "Good work! Score: {score}"
      show happy
    case > 7
      say "Amazing! Score: {score}"
      show excited
  end
end`,

  fortune_teller: `let fortunes = list
add "Yes, definitely!" to fortunes
add "Ask again later" to fortunes
add "Outlook not so good" to fortunes
add "It is certain!" to fortunes
add "Very doubtful" to fortunes

when shaken
  show thinking
  wait 1s
  let n = pick random 1 to 5
  let answer = item n of fortunes
  say answer
  show calm
end`,

  reaction_game: `let best = 999
load best

when start
  say "Reaction game!"
  say "Best: {best}ms"
  show calm
end

when button_a pressed
  let delay_s = pick random 2 to 6
  say "Get ready..."
  show thinking
  wait delay_s
  show alert
  play "alert"
  say "NOW - press B!"
end`,

  obstacle_avoider: `when start
  say "Obstacle avoider ON"
  show happy
  move forward at 40%
end

forever
  if distance < 20cm
    stop
    show alert
    play "alert"
    wait 500ms
    move backward at 50% for 1s
    turn right 90
    move forward at 40%
  end
  wait 50ms
end`,

  hello_world: `when start
  say "Hello World!"
  show happy
  wait 1s
  say "I am a robot!"
  show excited
end

when button_a pressed
  say "Button A pressed!"
  show thinking
end

when button_b pressed
  say "Button B pressed!"
  show calm
end`,
}

function populateExamples(examples) {
  const sel = $('example-select')
  sel.innerHTML = '<option value="">📂 Load example...</option>'
  const all = { ...BUILTIN_EXAMPLES, ...examples }
  Object.keys(all).forEach(key => {
    const opt = document.createElement('option')
    opt.value = key
    opt.textContent = key.replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase())
    sel.appendChild(opt)
  })
  window._examples = all
}

async function loadExamples() {
  try {
    const base = location.hostname === 'localhost' ? '' : '/appyscript'
    const res = await fetch(base + '/examples/index.json')
    if (res.ok) {
      const remote = await res.json()
      populateExamples(remote)
      return
    }
  } catch(e) {}
  populateExamples({})
}

$('example-select').addEventListener('change', e => {
  const key = e.target.value
  if (key && window._examples?.[key]) {
    $('editor').value = window._examples[key]
    e.target.value = ''
    updateLineCount()
    runCompile()
  }
})

// ── URL sharing ───────────────────────────────────────────────────────────────
function shareProgram() {
  const code = $('editor').value
  const encoded = btoa(unescape(encodeURIComponent(code)))
  const url = location.origin + location.pathname + '?code=' + encoded
  navigator.clipboard.writeText(url).then(() => {
    const toast = $('toast')
    toast.classList.add('show')
    setTimeout(() => toast.classList.remove('show'), 2500)
  })
}

function loadFromURL() {
  const params = new URLSearchParams(location.search)
  const code = params.get('code')
  if (code) {
    try {
      $('editor').value = decodeURIComponent(escape(atob(code)))
      return true
    } catch(e) {}
  }
  return false
}

// ── Compile ───────────────────────────────────────────────────────────────────
let compileDebounce
function scheduleCompile() {
  clearTimeout(compileDebounce)
  compileDebounce = setTimeout(runCompile, 700)
}

async function runCompile() {
  const source = $('editor').value.trim()
  if (!source) return
  const target = $('target-select').value

  try {
    const { compile, explain } = await getCompiler()
    const result = compile(source, target)

    renderDiagnostics(result.diagnostics, source)
    renderBadge(result)

    $('output-code').textContent = result.code || '# No code generated'

    const exp = explain(source)
    $('view-explain').innerHTML = exp.split('\n').map(line =>
      line.startsWith('•')
        ? `<div class="explain-block"><span class="explain-icon">→</span><span>${esc(line.slice(2))}</span></div>`
        : `<div style="color:var(--muted);font-size:12px;padding:4px 0">${esc(line)}</div>`
    ).join('')

  } catch(err) {
    $('output-code').textContent = '# ' + err.message
    renderDiagnostics([{severity:'error',code:'E000',message:err.message}], source)
    $('status-badge').innerHTML = '<span class="badge badge-error">✖ Error</span>'
  }
}

// ── Simulate ──────────────────────────────────────────────────────────────────
async function runSimulate() {
  switchTab('sim')
  const source = $('editor').value.trim()
  if (!source) return

  $('sim-panel').innerHTML = '<div class="empty-state"><div class="spinner"></div><div>Simulating...</div></div>'

  try {
    const { compile, simulate } = await getCompiler()
    const cResult = compile(source, 'esp32', { skipLint: true })
    if (!cResult.ast) {
      $('sim-panel').innerHTML = `<div style="color:var(--error);padding:16px">Fix errors first:<br>${cResult.errors.map(e=>esc(e.message)).join('<br>')}</div>`
      return
    }

    const trigEvents = []
    if ($('s-shaken').checked) trigEvents.push('shaken')

    const result = simulate(cResult.ast, {
      sensors: {
        distance:    parseInt($('s-distance').value),
        light:       parseInt($('s-light').value),
        temperature: parseInt($('s-temp').value),
        touch: 0, acceleration: 0,
      },
      buttons: { a: $('s-btn-a').checked, b: $('s-btn-b').checked },
      triggerEvents: trigEvents,
      maxTicks: 40,
    })
    renderSim(result)
  } catch(err) {
    $('sim-panel').innerHTML = `<div style="color:var(--error);padding:16px">✖ ${esc(err.message)}</div>`
  }
}

// ── Render helpers ────────────────────────────────────────────────────────────
function renderDiagnostics(diagnostics, source) {
  const panel = $('diag-panel')
  const sourceLines = (source||'').split('\n')
  if (!diagnostics.length) {
    panel.innerHTML = '<div class="diag-ok">✔ No errors or warnings</div>'
    return
  }
  panel.innerHTML = diagnostics.slice(0,10).map(d => {
    const cls = `diag-${d.severity==='error'?'error':d.severity==='warning'?'warn':'hint'}`
    const icon = d.severity==='error'?'✖':d.severity==='warning'?'⚠':'●'
    const loc  = d.span ? `Line ${d.span.line}` : ''
    const hint = d.hint ? `<br><small style="opacity:.7">ℹ ${esc(d.hint)}</small>` : ''
    const fix  = d.fix  ? `<br><small style="color:var(--ok)">💡 ${esc(d.fix.description)}</small>` : ''
    return `<div class="diag-row ${cls}">
      <span>${icon}</span>
      <span class="diag-code">[${esc(d.code)}]</span>
      <span style="flex:1">${esc(d.message)}${hint}${fix}</span>
      <span class="diag-loc">${loc}</span>
    </div>`
  }).join('')
}

function renderBadge(result) {
  const b = $('status-badge')
  if (!result.ok)
    b.innerHTML = `<span class="badge badge-error">✖ ${result.errors.length} error${result.errors.length>1?'s':''}</span>`
  else if (result.warnings.length)
    b.innerHTML = `<span class="badge badge-warn">⚠ ${result.warnings.length} warning${result.warnings.length>1?'s':''}</span>`
  else
    b.innerHTML = `<span class="badge badge-ok">✔ OK</span>`
}

function renderSim(result) {
  const events = result.events.slice(0, 60)
  const evHtml = events.length ? events.map(e => {
    const detail = Object.entries(e.data).map(([k,v]) =>
      `${esc(k)}=<b style="color:var(--accent2)">${esc(String(v))}</b>`
    ).join(' ')
    return `<div class="sim-event">
      <span class="sim-tick">[${e.tick}]</span>
      <span class="sim-type">${esc(e.type)}</span>
      <span>${detail}</span>
    </div>`
  }).join('') : '<div style="color:var(--muted);padding:8px 0">No events — adjust sliders or check buttons above.</div>'

  const s = result.finalState
  const vars = [...s.variables.entries()].map(([k,v]) =>
    `<div class="sim-kv"><span class="sim-k">${esc(k)}</span><span class="sim-v">${esc(String(v))}</span></div>`
  ).join('')

  $('sim-panel').innerHTML = `
    <div style="padding:12px 0 8px;font-size:12px;color:var(--muted)">
      ${result.success?'✔':'✖'} ${result.events.length} events · ${result.ticks} ticks
      ${result.error?`<span style="color:var(--error)"> · ${esc(result.error)}</span>`:''}
    </div>
    ${evHtml}
    <div class="sim-state">
      <h3>Final robot state</h3>
      <div class="sim-kv"><span class="sim-k">position</span><span class="sim-v">x=${s.position.x.toFixed(1)} y=${s.position.y.toFixed(1)} heading=${s.position.heading}°</span></div>
      <div class="sim-kv"><span class="sim-k">expression</span><span class="sim-v">${esc(s.expression)}</span></div>
      <div class="sim-kv"><span class="sim-k">display</span><span class="sim-v">${esc(s.displayText||'(blank)')}</span></div>
      ${vars}
    </div>
  `
}

function updateLineCount() {
  const lines = $('editor').value.split('\n').length
  $('line-count').textContent = lines + ' lines'
}

function copyCode() {
  navigator.clipboard.writeText($('output-code').textContent).then(() => {
    const btn = document.querySelector('.copy-btn')
    const old = btn.textContent; btn.textContent = '✔ Copied!'
    setTimeout(() => btn.textContent = old, 1500)
  })
}

// ── Event wiring ──────────────────────────────────────────────────────────────
$('editor').addEventListener('input', () => { scheduleCompile(); updateLineCount() })
$('target-select').addEventListener('change', runCompile)

// ── Init ──────────────────────────────────────────────────────────────────────
async function init() {
  await loadExamples()

  // Load code from URL share link, or default example
  if (!loadFromURL()) {
    $('editor').value = BUILTIN_EXAMPLES.guard_robot
  }
  updateLineCount()

  // Load compiler and first compile
  try {
    await getCompiler()
    $('diag-panel').innerHTML = '<div class="diag-ok">✔ Compiler ready</div>'
    runCompile()
  } catch(err) {
    $('diag-panel').innerHTML = `<div style="color:var(--error);padding:10px 16px">⚠ ${esc(err.message)}</div>`
    $('output-code').textContent = '# Compiler not loaded\n# Run: npm run build\n# Then open this file via a local server'
  }
}

init()
</script>
</body>
</html>
