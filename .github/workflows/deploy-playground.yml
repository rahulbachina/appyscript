name: Deploy Playground to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install & build
        run: npm ci && npm run build

      - name: Assemble site
        run: |
          mkdir -p _site
          # Playground as root index
          cp playground/index.html _site/index.html
          # Compiler dist (so playground can import it)
          mkdir -p _site/dist
          cp -r dist/* _site/dist/
          # Ensure browser bundle is included
          ls _site/dist/
          # Examples as JSON for the playground to fetch
          node -e "
            const fs = require('fs');
            const examples = {};
            fs.readdirSync('examples').filter(f => f.endsWith('.appy')).forEach(f => {
              const name = f.replace('.appy','');
              examples[name] = fs.readFileSync('examples/' + f, 'utf8');
            });
            fs.mkdirSync('_site/examples', { recursive: true });
            fs.writeFileSync('_site/examples/index.json', JSON.stringify(examples, null, 2));
            console.log('Examples bundled:', Object.keys(examples).join(', '));
          "
          # Runtime libs for download
          mkdir -p _site/runtime
          cp -r runtime/* _site/runtime/
          # Docs
          mkdir -p _site/docs
          cp -r docs/* _site/docs/
          echo "Site contents:"
          find _site -type f | sort

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
