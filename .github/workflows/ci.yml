name: CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Run tests
        run: node --test dist/test/compiler.test.js

      - name: Compile all examples on all targets
        run: |
          for file in examples/*.appy; do
            for target in esp32 pico microbit arduino circuitpython; do
              echo "Testing $file on $target..."
              node dist/cli.js compile "$file" --target $target 2>&1 | grep -E "Compiled|error" || true
            done
          done

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'
      - run: npm ci
      - name: Check TypeScript strict mode
        run: npx tsc --noEmit --strict
